# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 2

extraLabels:
  tenant: crossroads

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: tenant
          operator: In
          values:
          - crossroads

tolerations:
  - key: tenant
    operator: Equal
    value: crossroads
    effect: NoSchedule


hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 85
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

ingress:
  tls:
    enabled: true
  annotations:
    kubernetes.io/tls-acme: "true"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "32m"
  modSecurity:
    enabled: false
    secRuleEngine: "DetectionOnly"
  spec:
    ingressClassName: "nginx"
service:
  externalPort: 5000
  internalPort: 8080
livenessProbe:
  path: "/healthz"
  initialDelaySeconds: 30
  timeoutSeconds: 15
  failureThreshold: 5
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: "/healthz"
  initialDelaySeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  scheme: "HTTP"
  probeType: "httpGet"

resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]
